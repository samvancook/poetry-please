<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex, nofollow">
    <title>TikTok authorization | Button Poetry</title>
    <link rel="stylesheet" href="/tiktok-auth/style.css">
    <script src="/tiktok-auth/callback.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Button Poetry TikTok authorization</h1>
      <p id="status" role="status">Finishing authorization…</p>
      <section id="result" hidden>
        <p>This one-time code is for Button Poetry's internal publisher setup. Keep it private and use it promptly; TikTok expires it after 10 minutes.</p>
        <output id="authorization-code" aria-label="One-time authorization code"></output>
        <button id="copy-code" type="button">Copy code</button>
        <p id="copy-status" role="status"></p>
      </section>
    </main>
  </body>
</html>
